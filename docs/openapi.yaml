openapi: 3.1.0
info:
  title: SyncWatch API
  version: 0.1.0
  summary: Contrat REST du backend SyncWatch (ft_transcendence).
  description: |
    Toutes les routes répondent en JSON, sauf les redirections OAuth et les
    fichiers statiques.

    **Authentification.** Les routes privées attendent l'en-tête
    `Authorization: Bearer <token>`. Le token est obtenu via `/auth/signup`,
    `/auth/login` ou une connexion OAuth. Il fait 64 caractères hexadécimaux et
    expire au bout de 7 jours.

    **Erreurs.** Une erreur renvoyée par un handler a la forme
    `{"error": "message"}`. Les requêtes rejetées par Axum *avant* le handler
    ont en revanche un corps en **texte brut** (`text/plain`) :

    | Cas | Code |
    |---|---|
    | Paramètre de chemin ou de requête manquant ou mal formé | 400 |
    | Corps JSON syntaxiquement invalide | 400 |
    | Corps JSON valide mais champ manquant ou de mauvais type | 422 |
    | En-tête `Content-Type: application/json` absent | 415 |
    | Méthode non prévue sur ce chemin | 405 (corps vide) |

    Un client doit donc lire `Content-Type` avant de décoder une erreur.

    Les événements temps réel (WebSocket) sont décrits dans `websocket.md`.

servers:
  - url: http://localhost:3000
    description: Développement local (valeur de PORT dans .env)

tags:
  - name: Auth
    description: Inscription, connexion par mot de passe, déconnexion.
  - name: OAuth
    description: Connexion via Google ou GitHub (flux authorization code).
  - name: Users
    description: Profil de l'utilisateur connecté.
  - name: Friends
    description: Demandes d'amis et liste d'amis.
  - name: Media
    description: Catalogue vidéo agrégé (Internet Archive, PeerTube).
  - name: Static
    description: Fichiers envoyés par les utilisateurs.

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Créer un compte
      description: Crée le compte et ouvre directement une session.
      operationId: signup
      security: []  # route publique, volontairement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Compte créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Pseudo ou email vide, ou mot de passe de moins de 8 caractères.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Pseudo ou email déjà utilisé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter par mot de passe
      operationId: login
      security: []  # route publique, volontairement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session ouverte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: |
            Identifiants invalides. La réponse est identique que le compte
            n'existe pas, que le mot de passe soit faux, ou que le compte ait
            été créé via OAuth (il n'a alors pas de mot de passe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Se déconnecter
      description: Supprime la session en base. Le token devient inutilisable.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session supprimée.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/oauth/providers:
    get:
      tags: [OAuth]
      summary: Lister les fournisseurs activés
      description: |
        Un fournisseur est activé quand son identifiant et son secret client
        sont présents dans la configuration du serveur. Le frontend affiche
        toujours les boutons ; cette route sert à vérifier la configuration.
      operationId: listOAuthProviders
      security: []  # route publique, volontairement
      responses:
        '200':
          description: Fournisseurs utilisables.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthProvider'
              example: [google, github]

  /auth/oauth/{provider}/start:
    get:
      tags: [OAuth]
      summary: Démarrer une connexion OAuth
      description: |
        À ouvrir par **navigation** du navigateur (lien ou `location.href`),
        pas avec `fetch`. Le serveur pose deux cookies (HttpOnly, SameSite=Lax,
        10 minutes) et redirige vers la page de consentement du fournisseur :
        `oauth_state` (protection CSRF) et `oauth_return` (le frontend d'où
        vient l'utilisateur, déduit de l'en-tête `Referer`).

        `{FRONTEND_URL}` désigne dans ce document ce frontend d'origine. Il
        n'est retenu que s'il figure dans la liste autorisée de la
        configuration ; sinon la première adresse de la liste est utilisée.

        Si le fournisseur n'est pas configuré sur ce serveur, la redirection
        mène à `{FRONTEND_URL}/oauth/callback?error=oauth_unavailable`, sans cookie.
      operationId: startOAuth
      security: []  # route publique, volontairement
      parameters:
        - $ref: '#/components/parameters/OAuthProviderParam'
      responses:
        '303':
          description: Redirection vers le fournisseur, ou vers le frontend s'il n'est pas configuré.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
                example: oauth_state=9f2c…; Path=/auth/oauth; Max-Age=600; HttpOnly; SameSite=Lax
        '400':
          description: Fournisseur inconnu (corps en texte brut).

  /auth/oauth/{provider}/callback:
    get:
      tags: [OAuth]
      summary: Retour du fournisseur OAuth
      description: |
        Appelé par le navigateur au retour de Google ou GitHub. Ne renvoie
        jamais de JSON : toujours une redirection vers le frontend.

        - **Succès** : `{FRONTEND_URL}/oauth/callback#token=<token>`. Le token
          est dans le fragment, qui n'est jamais envoyé à un serveur.
        - **Échec** : `{FRONTEND_URL}/oauth/callback?error=oauth`. La cause exacte
          (state invalide, refus, email non vérifié…) n'est visible que dans
          les logs du serveur.

        La page `/oauth/callback` du frontend peut être ouverte dans une
        fenêtre popup : elle transmet alors le résultat à la page d'origine
        et se ferme. Ouverte en pleine page, elle redirige elle-même.

        Rattachement des comptes : l'identité externe est retrouvée par
        `(provider, id chez le fournisseur)`. À défaut, elle est rattachée au
        compte SyncWatch qui a le même email, uniquement si le fournisseur
        garantit que cet email est vérifié. Sinon un nouveau compte sans mot
        de passe est créé.
      operationId: oauthCallback
      security: []  # route publique, volontairement
      parameters:
        - $ref: '#/components/parameters/OAuthProviderParam'
        - name: code
          in: query
          description: Code d'autorisation à usage unique fourni par le fournisseur.
          schema:
            type: string
        - name: state
          in: query
          description: Doit être identique à la valeur du cookie `oauth_state`.
          schema:
            type: string
        - name: error
          in: query
          description: Présent si l'utilisateur a refusé l'accès.
          schema:
            type: string
      responses:
        '303':
          description: Redirection vers le frontend (succès ou échec).
          headers:
            Location:
              schema:
                type: string
                format: uri

  /users/me:
    get:
      tags: [Users]
      summary: Lire son profil
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil de l'utilisateur connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Modifier son profil
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profil mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Pseudo vide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Pseudo déjà utilisé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/avatar:
    post:
      tags: [Users]
      summary: Envoyer un avatar
      description: |
        Le fichier est enregistré sous un nom aléatoire dans `uploads/avatars/`.
        Types acceptés : PNG, JPEG, WebP. Taille maximale : 2 Mo.
      operationId: uploadAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profil avec le nouvel `avatar_url`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Corps invalide, champ manquant, type non accepté ou fichier trop gros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /friends:
    get:
      tags: [Friends]
      summary: Lister ses amis
      description: Amitiés acceptées, triées par pseudo.
      operationId: listFriends
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des amis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Friend'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Friends]
      summary: Envoyer une demande d'ami
      operationId: sendFriendRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFriendRequest'
      responses:
        '201':
          description: Demande envoyée.
        '400':
          description: Tentative de s'ajouter soi-même.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Aucun utilisateur avec ce pseudo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Déjà amis, ou demande déjà en attente dans un sens ou l'autre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /friends/requests:
    get:
      tags: [Friends]
      summary: Lister les demandes reçues
      description: Demandes en attente adressées à l'utilisateur connecté.
      operationId: listFriendRequests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Expéditeurs des demandes en attente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Friend'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /friends/requests/{from_user_id}/accept:
    post:
      tags: [Friends]
      summary: Accepter une demande d'ami
      operationId: acceptFriendRequest
      security:
        - bearerAuth: []
      parameters:
        - name: from_user_id
          in: path
          required: true
          description: Identifiant de l'utilisateur qui a envoyé la demande.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Le nouvel ami.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friend'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Aucune demande en attente de cet utilisateur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /friends/{friend_id}:
    delete:
      tags: [Friends]
      summary: Retirer un ami ou refuser une demande
      description: |
        Supprime le lien dans les deux sens, quel que soit son statut. Sert
        donc aussi à refuser ou annuler une demande. Répond 204 même si aucun
        lien n'existait.
      operationId: removeFriend
      security:
        - bearerAuth: []
      parameters:
        - name: friend_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Lien supprimé.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /media/search:
    get:
      tags: [Media]
      summary: Chercher des vidéos
      description: |
        Interroge les sources en parallèle, jusqu'à 12 résultats par source.
        Une source en panne n'est pas une erreur : ses résultats sont
        simplement absents.
      operationId: searchMedia
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Termes recherchés.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: provider
          in: query
          description: Limite la recherche à une seule source.
          schema:
            $ref: '#/components/schemas/MediaProvider'
      responses:
        '200':
          description: Résultats, toutes sources confondues.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaItem'
        '400':
          description: |
            `q` vide après suppression des espaces, ou de plus de 100
            caractères (JSON). `q` absent ou `provider` inconnu : rejeté par
            Axum, corps en texte brut.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /media/{provider}/{id}:
    get:
      tags: [Media]
      summary: Lire la fiche d'une vidéo
      description: Métadonnées et liens de lecture directs.
      operationId: getMediaDetails
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MediaProvider'
        - name: id
          in: path
          required: true
          description: |
            Identifiant chez la source. Archive : `[A-Za-z0-9._-]`, 100
            caractères maximum. PeerTube : UUID de 36 caractères.
          schema:
            type: string
      responses:
        '200':
          description: Fiche de la vidéo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDetails'
        '400':
          description: |
            Identifiant au mauvais format (JSON), ou source inconnue (rejetée
            par Axum, corps en texte brut).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La vidéo existe mais n'a aucun flux lisible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: La source ne répond pas ou a renvoyé une erreur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /uploads/avatars/{filename}:
    get:
      tags: [Static]
      summary: Télécharger un avatar
      description: Fichier servi tel quel. Le chemin complet est donné par `avatar_url`.
      operationId: getAvatar
      security: []  # route publique, volontairement
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            example: ad33aa136ce39086807c016f1c45d122.png
      responses:
        '200':
          description: L'image.
          content:
            image/png: {}
            image/jpeg: {}
            image/webp: {}
        '404':
          description: Fichier introuvable.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de session, 64 caractères hexadécimaux, valable 7 jours.

  parameters:
    OAuthProviderParam:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OAuthProvider'

  responses:
    Unauthorized:
      description: Token absent, invalide ou expiré.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Message lisible. Jamais de détail technique pour les erreurs 500.
      example:
        error: username already taken

    AuthResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          pattern: '^[0-9a-f]{64}$'

    SignupRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email ou pseudo.
        password:
          type: string

    UpdateProfileRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32

    UserProfile:
      type: object
      required: [id, username, email, avatar_url]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        avatar_url:
          type: [string, 'null']
          description: Chemin relatif au backend, par exemple `/uploads/avatars/….png`.

    AddFriendRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string

    Friend:
      type: object
      required: [id, username, avatar_url, online]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        avatar_url:
          type: [string, 'null']
        online:
          type: boolean
          description: Vrai si l'utilisateur a fait une requête authentifiée dans les 60 dernières secondes.

    OAuthProvider:
      type: string
      enum: [google, github]

    MediaProvider:
      type: string
      enum: [archive, peertube]

    MediaItem:
      type: object
      required: [provider, id, title, year, thumbnail, duration_seconds]
      properties:
        provider:
          $ref: '#/components/schemas/MediaProvider'
        id:
          type: string
        title:
          type: string
        year:
          type: [integer, 'null']
        thumbnail:
          type: [string, 'null']
          format: uri
        duration_seconds:
          type: [integer, 'null']
          description: Toujours `null` pour Internet Archive.

    StreamLink:
      type: object
      required: [kind, url, quality]
      properties:
        kind:
          type: string
          enum: [mp4, hls]
          description: '`mp4` se lit directement dans une balise video ; `hls` (playlist .m3u8) nécessite hls.js hors Safari.'
        url:
          type: string
          format: uri
          description: Lien direct chez la source. Le flux ne passe pas par le backend.
        quality:
          type: [string, 'null']
          examples: [480p, auto]

    MediaDetails:
      allOf:
        - $ref: '#/components/schemas/MediaItem'
        - type: object
          required: [description, backdrop, streams]
          properties:
            description:
              type: [string, 'null']
              description: |
                Peut contenir du HTML venant de la source. À afficher en texte
                brut uniquement, jamais injecté tel quel dans la page.
            backdrop:
              type: [string, 'null']
              format: uri
              description: Image plus grande que `thumbnail`. Toujours `null` pour Internet Archive.
            streams:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/StreamLink'
