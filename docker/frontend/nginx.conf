# Toute connexion navigateur doit passer en HTTPS (exigence du sujet) :
# le port 80 ne fait que rediriger vers le port 443. Port host code en dur
# (8443, voir docker-compose.yml) : $host ne contient jamais le port cote nginx.
server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/syncwatch.crt;
    ssl_certificate_key /etc/nginx/certs/syncwatch.key;

    # DNS Docker interne, avec une duree de vie courte : par defaut, nginx
    # resout "backend" une seule fois au demarrage et garde l'IP en cache. Si
    # le conteneur backend redemarre (il en change), nginx reste bloque sur
    # l'ancienne adresse jusqu'a son propre redemarrage. Passer par une
    # variable force une resolution a chaque requete.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:3000;

    # index.html ne doit jamais etre mis en cache : c'est lui qui reference
    # le nom (hashe) du bundle JS courant. Sans ca, un navigateur peut servir
    # une vieille page qui pointe vers un bundle qui n'existe plus/est perime.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Les fichiers dans /assets ont un hash dans leur nom (ex: index-Cym4yT65.js) :
    # un nouveau build genere un nouveau nom, donc on peut les cacher longtemps
    # sans jamais risquer de servir du contenu perime.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Avatars uploades : servis directement par le backend, pas sous /api car
    # ce sont des <img src> bruts, pas des appels fetch(). Aucune route Vue
    # Router ne s'appelle /uploads, donc pas de collision possible.
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API REST : prefixe /api pour eviter toute collision avec les pages
    # Vue Router (ex: /friends existe des deux cotes - page ET endpoint).
    # proxy_pass vers une variable (DNS dynamique) desactive la reecriture
    # automatique d'URI de nginx : on retire le prefixe /api a la main.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (chat + sync de lecture) : upgrade de connexion + timeout
    # etendu (une salle peut rester ouverte longtemps sans trafic).
    location /api/ws {
        rewrite ^/api/ws(.*)$ /ws$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Si le backend est injoignable (redemarrage, crash), renvoyer une erreur
    # rapide plutot que de laisser le navigateur attendre indefiniment.
    proxy_connect_timeout 5s;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
