services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Limited to 127.0.0.1: reachable locally (psql, make dev) but no
    # longer from the network - the Docker backend itself goes through
    # "db:5432" internally and doesn't need this.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backup:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backup_data:/backups
      - uploads_data:/uploads
      - ./scripts/backup-db.sh:/scripts/backup-db.sh:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "Starting scheduled backup..."

          if /bin/sh /scripts/backup-db.sh; then
            echo "Backup completed. Next backup in 24 hours."
            sleep 86400
          else
            echo "Backup failed. Retrying in 5 minutes."
            sleep 300
          fi
        done

  # One-shot: creates the read-only "monitoring" role used by
  # postgres-exporter, then exits. Idempotent, so it simply runs again on
  # every `make up` (see scripts/monitoring-db-init.sh).
  monitoring-db-init:
    image: docker.io/library/postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
    volumes:
      - ./scripts/monitoring-db-init.sh:/scripts/monitoring-db-init.sh:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/monitoring-db-init.sh"]

  # Translates PostgreSQL's statistics into Prometheus metrics, served on
  # postgres-exporter:9187/metrics. No published port: only Prometheus,
  # on the internal network, reads it. If the monitoring role doesn't
  # exist yet, it reports pg_up 0 and reconnects on the next scrape.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${MONITORING_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # Collects and stores the metrics of the backend and postgres-exporter
  # (targets in docker/prometheus/prometheus.yml). Its web UI is published
  # on 127.0.0.1 only: reachable from this machine for debugging, never
  # from the network.
  prometheus:
    build:
      context: docker/prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Older data is deleted automatically: a week is plenty for a demo
      # and keeps the volume small.
      - --storage.tsdb.retention.time=7d
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # No depends_on: a target that isn't up yet is simply shown as DOWN
    # until the next scrape. It also keeps Podman from refusing to
    # recreate the backend while Prometheus "depends" on it.

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: ${PORT}
      RUST_LOG: ${RUST_LOG}
      PEERTUBE_URL: ${PEERTUBE_URL:-https://framatube.org}
      BACKEND_URL: ${BACKEND_URL:-https://localhost:8080/api}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    # No published port: the browser only talks to nginx (HTTPS), never
    # directly to the backend. Only the internal Docker network can reach it.
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Makes the official nginx image populate $NGINX_LOCAL_RESOLVERS from
      # this container's own /etc/resolv.conf at startup, instead of a
      # hardcoded DNS address - see the `resolver` directive in
      # nginx.conf.template for why (Docker vs Podman).
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: 1
      # Target that nginx reverse-proxies for /api and /uploads. Defaults
      # to the Docker service name; `make dev` points it at
      # host.docker.internal for a native backend (cargo run), see Makefile.
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:3000}
    ports:
      - "8080:443"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
  backup_data:
  prometheus_data: