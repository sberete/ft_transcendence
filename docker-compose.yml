services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Limited to 127.0.0.1: reachable locally (psql, make dev) but no
    # longer from the network - the Docker backend itself goes through
    # "db:5432" internally and doesn't need this.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: ${PORT}
      RUST_LOG: ${RUST_LOG}
      PEERTUBE_URL: ${PEERTUBE_URL:-https://framatube.org}
      BACKEND_URL: ${BACKEND_URL:-https://localhost:8080/api}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    # No published port: the browser only talks to nginx (HTTPS), never
    # directly to the backend. Only the internal Docker network can reach it.
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Target that nginx reverse-proxies for /api and /uploads. Defaults
      # to the Docker service name; `make dev` points it at
      # host.docker.internal for a native backend (cargo run), see Makefile.
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:3000}
    ports:
      - "8080:443"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
